    - generic [ref=e177]:
      - heading "Die Startup Messe in NRW" [level=2] [ref=e178]
      - generic [ref=e179]:
        - paragraph [ref=e180]: Die Startup Contacts ist Deutschlands größte studentisch organisierte Startup Messe. Am 15. Juni 2026 bringen wir in der Halle Münsterland in Münster Startups, mittelständische Unternehmen, Studierende und Investoren zusammen.
        - paragraph [ref=e181]: "Organisiert wird die Messe vom Venture Club Münster e.V., einer studentischen Initiative an der Universität Münster. Münster zählt mit über 60.000 Studierenden zu den Top-5 Gründungshochschulen in Deutschland. Dieses Potenzial nutzen wir: Über 30 Aussteller, 20 Speaker, fünf Veranstaltungsformate und mehr als 1.000 Besucher machen die Startup Contacts zur zentralen Innovationsmesse in NRW."
        - paragraph [ref=e182]: Was uns von anderen Events unterscheidet, ist unser Fokus auf Co-Creation. Bei uns stehen nicht Vorträge und Messestände im Mittelpunkt, sondern die aktive Zusammenarbeit. In unseren Formaten arbeiten Startups, Unternehmen und Talente gemeinsam an echten Herausforderungen und entwickeln Lösungen, die den Mittelstand bei der Transformation unterstützen.
        - paragraph [ref=e183]: "Auf unserer Main Stage sprechen Speaker von Unternehmen wie SAP LeanIX, Fiege und Flaschenpost. Dazu kommen Live Podcasts mit Gründerinnen und Gründern, praxisnahe Workshops und das Innovation Village, in dem junge Startups aus sechs Fokusfeldern ausstellen: Produktion, Logistik, Energie, Bau und Handwerk, Betriebsinfrastruktur sowie Lifestyle. So vereint die Startup Contacts 2026 Elemente einer klassischen Startup Messe, eines Startup Kongresses und einer Innovation Convention an einem Tag."
        - paragraph [ref=e184]:
          - text: Münster ist dafür der ideale Standort. Mit einem aktiven Startup Ökosystem und starken Mittelstandsunternehmen in der Region bringt die Stadt Talente, Gründerinnen, Gründer und Corporates zusammen. Die Halle Münsterland liegt zentral und ist sowohl mit dem Auto als auch per Bahn gut erreichbar. Mehr über die
          - link "Startup Szene in Münster" [ref=e185] [cursor=pointer]:
            - /url: /startups-muenster
          - text: erfährst du auf unserer eigenen Seite dazu.
